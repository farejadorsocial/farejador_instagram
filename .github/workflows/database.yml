name: PostgreSQL

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farejador_instagram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d farejador_instagram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/farejador_instagram
      FAREJADOR_DISABLE_MONITOR: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate PostgreSQL and migration
        run: python -m backend.database.test_database

      - name: Validate synchronization
        run: python -m backend.database.test_sync

      - name: Compile backend
        run: python -m compileall -q backend
