name: Backend

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farejador_instagram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d farejador_instagram"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure database
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/farejador_instagram
        run: |
          python -c "from backend.database.init_db import criar_tabelas; criar_tabelas()"
          python -m backend.database.verify

      - name: Compile backend
        run: python -m compileall -q backend
