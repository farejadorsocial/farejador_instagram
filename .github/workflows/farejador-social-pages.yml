# Publicação automática dos dados do Farejador Social

name: Publicar dados do Farejador Social

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "farejador-social-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Garantir estrutura pública
        run: |
          mkdir -p site/instagram/perfis
          if [ ! -f site/index.html ]; then
            cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex,nofollow">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Farejador Social — Dados públicos</title>
          </head>
          <body>
            <h1>Farejador Social</h1>
            <p>Fonte pública de dados do monitoramento.</p>
          </body>
          </html>
          HTML
          fi

      - name: Enviar artefato para o GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
